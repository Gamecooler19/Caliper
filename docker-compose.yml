services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://caliper:caliper@postgres:5432/caliper}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379/0}
      META_MODEL_API_KEY: ${META_MODEL_API_KEY:-}
      SAM_MODEL_ID: ${SAM_MODEL_ID:-sam-3.1}
      MUSE_SPARK_MODEL_ID: ${MUSE_SPARK_MODEL_ID:-muse-spark-1.3}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      CALIPER_API_KEY: ${CALIPER_API_KEY:-}
      COLUMN_ENCRYPTION_KEY: ${COLUMN_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - caliper-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caliper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caliper}
      POSTGRES_DB: ${POSTGRES_DB:-caliper}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caliper} -d ${POSTGRES_DB:-caliper}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - caliper-net

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - caliper-net

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    depends_on:
      - api
    environment:
      CALIPER_DOMAIN: ${CALIPER_DOMAIN:-localhost}
      CALIPER_API_KEY: ${CALIPER_API_KEY:-}
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - caliper-net

networks:
  caliper-net:
    driver: bridge

volumes:
  postgres-data:
  valkey-data:
  caddy-data:
  caddy-config:
